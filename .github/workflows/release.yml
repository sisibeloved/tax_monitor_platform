name: 签名发布候选

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: 发布候选版本
        required: true
      application_image_digest:
        description: 已构建应用镜像的 sha256 摘要
        required: true
      environment:
        description: 目标环境
        required: true
        type: choice
        options: [pilot, production]

permissions:
  actions: read
  attestations: read
  contents: read
  id-token: write
  packages: read

jobs:
  replay-and-sign:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: 验证同一提交已有成功 CI
        id: successful_ci
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "ci.yml",
              head_sha: context.sha,
              status: "success",
              per_page: 100,
            });
            const successfulRuns = response.data.workflow_runs
              .filter((run) =>
                run.head_sha === context.sha &&
                run.conclusion === "success" &&
                run.event === "push" &&
                run.path === ".github/workflows/ci.yml",
              )
              .sort((left, right) => right.id - left.id);
            if (successfulRuns.length === 0) {
              core.setFailed(`提交 ${context.sha} 没有成功的持续集成运行`);
              return;
            }
            const run = successfulRuns[0];
            core.setOutput("run_id", String(run.id));
            core.setOutput("run_url", run.html_url);
            core.notice(`发布候选绑定 CI ${run.html_url}`);
      - name: 下载成功 CI 的镜像来源制品
        uses: actions/download-artifact@v4
        with:
          name: ci-image-provenance
          path: ci-evidence
          github-token: ${{ github.token }}
          run-id: ${{ steps.successful_ci.outputs.run_id }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
      - name: 安装后端依赖
        run: uv venv backend/.venv && uv pip install --python backend/.venv/bin/python -e 'backend[dev]'
      - name: 重放候选并生成待签清单
        env:
          RELEASE_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          APPLICATION_IMAGE_DIGEST: ${{ inputs.application_image_digest }}
        run: make verify-release
      - name: 核验并记录候选来源
        env:
          APPLICATION_IMAGE_DIGEST: ${{ inputs.application_image_digest }}
          SUCCESSFUL_CI_RUN_ID: ${{ steps.successful_ci.outputs.run_id }}
          SUCCESSFUL_CI_RUN_URL: ${{ steps.successful_ci.outputs.run_url }}
        run: |
          backend/.venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          output_dir = Path("artifacts/acceptance/phase-4")
          manifest = json.loads((output_dir / "release-manifest.json").read_text())
          ci_provenance = json.loads(
              Path("ci-evidence/ci-image-provenance.json").read_text()
          )
          checked_out_commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          expected_commit = os.environ["GITHUB_SHA"]
          expected_digest = os.environ["APPLICATION_IMAGE_DIGEST"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", expected_digest):
              raise SystemExit("application_image_digest 必须是规范 sha256 摘要")
          if checked_out_commit != expected_commit:
              raise SystemExit("检出的提交与工作流提交不一致")
          if ci_provenance["ci_run_id"] != os.environ["SUCCESSFUL_CI_RUN_ID"]:
              raise SystemExit("镜像来源制品不属于选定的成功 CI")
          if ci_provenance["source_commit"] != expected_commit:
              raise SystemExit("CI 镜像与发布候选提交不一致")
          if ci_provenance["application_image_digest"] != expected_digest:
              raise SystemExit("输入镜像摘要与成功 CI 构建结果不一致")
          if ci_provenance["workflow"] != ".github/workflows/ci.yml":
              raise SystemExit("镜像来源制品不是由受信 CI 工作流生成")
          if manifest["git_commit"] != expected_commit:
              raise SystemExit("发布清单未绑定当前提交")
          if manifest["application_image_digest"] != expected_digest:
              raise SystemExit("发布清单未绑定输入镜像摘要")
          provenance = {
              "application_image_digest": expected_digest,
              "application_image_reference": ci_provenance[
                  "application_image_reference"
              ],
              "ci_run_id": os.environ["SUCCESSFUL_CI_RUN_ID"],
              "ci_run_url": os.environ["SUCCESSFUL_CI_RUN_URL"],
              "release_workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "source_commit": expected_commit,
          }
          (output_dir / "release-provenance.json").write_text(
              json.dumps(provenance, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: 验证 GitHub 镜像构建证明
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE_REFERENCE=$(backend/.venv/bin/python -c 'import json; print(json.load(open("ci-evidence/ci-image-provenance.json"))["application_image_reference"])')
          gh attestation verify "oci://${IMAGE_REFERENCE}" --repo "$GITHUB_REPOSITORY"
      - name: 获取 GitHub OIDC 工作负载令牌
        id: workload_identity
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('tax-risk-release');
            core.setSecret(token);
            return token;
          result-encoding: string
      - name: 获取工作负载身份并由 KMS/HSM 签名
        env:
          KMS_SIGNING_ENDPOINT: ${{ secrets.KMS_SIGNING_ENDPOINT }}
          KMS_RELEASE_KEY_ID: ${{ vars.KMS_RELEASE_KEY_ID }}
          KMS_ALLOWED_KEY_IDS: ${{ vars.KMS_ALLOWED_KEY_IDS }}
          WORKLOAD_IDENTITY_TOKEN: ${{ steps.workload_identity.outputs.result }}
        run: >-
          backend/.venv/bin/python -m tax_risk.adapters.signing.kms_ed25519_signer
          --sign
          --manifest artifacts/acceptance/phase-4/release-manifest.json
          --output-dir artifacts/acceptance/phase-4
      - name: 上传待晋级签名制品
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-candidate
          path: artifacts/acceptance/phase-4
      - name: 清除工作目录副本
        run: rm -rf artifacts/acceptance/phase-4
      - name: 重新下载签名制品
        uses: actions/download-artifact@v4
        with:
          name: signed-release-candidate
          path: artifacts/acceptance/phase-4
      - name: 晋级前重新验证下载制品
        run: >-
          backend/.venv/bin/python -m tax_risk.adapters.signing.kms_ed25519_signer
          --verify-only
          --bundle artifacts/acceptance/phase-4/signed-manifest.json
